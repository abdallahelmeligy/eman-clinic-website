<div class="bkm" id="bkm" hidden>
  <div class="bkm__box" role="dialog" aria-modal="true" aria-labelledby="bkmT">
    <button class="bkm__x" id="bkmX" aria-label="إغلاق">&#10005;</button>
    <span class="foot__k">BOOK NOW</span>
    <h3 id="bkmT">احجزي موعدك</h3>
    <p class="bkm__lede">عبّئي بياناتك وسنستقبل طلبك على واتساب لتأكيد الموعد.</p>
    <form class="bkm__f" id="bkmF" novalidate>
      <label>الاسم<input type="text" id="bkmName" autocomplete="name" placeholder="الاسم الكامل" required></label>
      <label>رقم الجوال<input type="tel" id="bkmPhone" inputmode="tel" autocomplete="tel" placeholder="05XXXXXXXX" required></label>
      <label>الخدمة
        <select id="bkmService">
          <option value="">— اختاري —</option>
          <option>الجلدية والتجميل</option><option>الليزر</option>
          <option>النساء والولادة</option><option>طب وجراحة الأسنان</option>
          <option>استشارة عامة</option>
        </select>
      </label>
      <label>الفرع
        <select id="bkmBranch">
          <option value="">— اختاري —</option>
          <option>فرع القدس — مخرج ١٠</option><option>فرع قرطبة — مخرج ٨</option>
        </select>
      </label>
      <label>الوقت المناسب للتواصل
        <select id="bkmTime">
          <option value="">— اختاري —</option>
          <option>صباحًا (٩ — ١٢)</option><option>ظهرًا (١٢ — ٤)</option><option>مساءً (٤ — ١٠)</option>
        </select>
      </label>
      <p class="book__err" id="bkmErr" role="alert" hidden></p>
      <button class="btn btn--p" type="submit">إرسال الطلب عبر واتساب</button>
    </form>
  </div>
</div>
<div class="pop" id="pop" hidden>
  <div class="pop__box" role="dialog" aria-modal="true" aria-label="عروض اليوم الوطني">
    <button class="pop__x" id="popX" aria-label="إغلاق">&#10005;</button>
    <a class="pop__img" href="offers.html" aria-label="تصفّحي عروض اليوم الوطني">
      <img src="assets/img/offers/national-day-portrait.webp" alt="عروض اليوم الوطني السعودي ٩٦ من عيادات د. إيمان العبرة"
           width="1000" height="1250" decoding="async">
    </a>
    <div class="pop__cta">
      <a class="btn btn--p" href="offers.html">تصفّحي العروض</a>
      <button class="pop__later" id="popLater" type="button">ليس الآن</button>
    </div>
  </div>
</div>
